    <meta charset="UTF-8" />
    <!-- No loader / no pulsing splash. Page paints instantly on a plain
         background. When a valid PageSnapshot exists for the current path,
         it's injected inline below (see the pre-hydration script at the
         bottom of <body>) so returning visitors see the previous UI
         immediately — no spinner, no flash. -->
    <style>
      :root { color-scheme: dark; }
      html, body { background-color: #1c1c1c; margin: 0; }
      #root { min-height: 100dvh; background-color: #1c1c1c; }
      #root[data-snapshot-preview="true"] { pointer-events: none; user-select: none; contain: paint; }
      #instant-shell {
        position: fixed;
        inset: 0;
        z-index: 0;
        min-height: 100dvh;
        display: none;
        padding: 72px 24px 120px;
        box-sizing: border-box;
        background:
          linear-gradient(180deg, rgba(10,10,10,.16), rgba(10,10,10,.84)),
          url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260704_143500_a76b8e64-2c69-4683-80e7-2bb060a921d6.png&w=768&q=70") center/cover,
          #0a0a0a;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 180ms ease;
      }
      #instant-shell[data-active="true"] { display: flex; flex-direction: column; justify-content: center; }
      #instant-shell[data-hidden="true"] { opacity: 0; pointer-events: none; }
      #instant-shell .instant-shell__inner { width: min(420px, 100%); }
      #instant-shell .instant-shell__badge { display: inline-flex; align-items: center; margin-bottom: 32px; padding: 10px 12px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.88); font-size: 12px; }
      #instant-shell h1 { margin: 0; max-width: 340px; font-size: 34px; line-height: 1.08; font-weight: 500; letter-spacing: 0; }
      #instant-shell .instant-shell__marquee { margin: 30px -24px 0; display: flex; gap: 10px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
      #instant-shell .instant-shell__chip { flex: 0 0 auto; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 10px 15px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.88); font-size: 14px; }
      #instant-shell .instant-shell__cta { position: absolute; left: 24px; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom)); height: 56px; display: grid; place-items: center; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18); color: #fff; font-size: 16px; font-weight: 600; }
      @media (min-width: 769px) { #instant-shell { display: none !important; } }
    </style>

    <!-- Global SVG filter used by liquid-glass surfaces (.gemini-glass-tile, plus sheet). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="megsy-glass-warp" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="2" seed="7" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="28" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <div id="instant-shell" aria-hidden="true">
      <div class="instant-shell__inner">
        <div class="instant-shell__badge">Megsy AI</div>
        <h1>All the AI you need, one tap away.</h1>
        <div class="instant-shell__marquee"><span class="instant-shell__chip">GPT</span><span class="instant-shell__chip">Claude</span><span class="instant-shell__chip">Gemini</span><span class="instant-shell__chip">Images</span><span class="instant-shell__chip">Video</span></div>
      </div>
      <div class="instant-shell__cta">Start now</div>
    </div>
    <script>
      (function () {
        try {
          var shell = document.getElementById("instant-shell");
          var root = document.getElementById("root");
          if (!shell || !root) return;
          var path = (location.pathname || "/").split(/[?#]/)[0];
          var isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
          var seenWelcome = false;
          try { seenWelcome = localStorage.getItem("megsy_seen_welcome") === "1"; } catch (e) {}
          if (!isMobile || seenWelcome || !(path === "/" || path === "/welcome")) {
            shell.remove();
            return;
          }
          shell.setAttribute("data-active", "true");
          var removeNow = function () {
            if (shell && shell.parentNode) shell.parentNode.removeChild(shell);
            shell = null;
          };
          if (root.getAttribute("data-snapshot-preview") === "true") {
            removeNow();
            return;
          }
          var hide = function () {
            if (!shell || shell.getAttribute("data-hidden") === "true") return;
            shell.setAttribute("data-hidden", "true");
            setTimeout(function () { if (shell && shell.parentNode) shell.parentNode.removeChild(shell); }, 220);
          };
          var isRealContent = function () {
            if (root.getAttribute("data-snapshot-preview") === "true") return false;
            if (root.querySelector("[data-shell], form, textarea, input:not([type='hidden'])")) return true;
            if (root.children.length > 0 && String(root.textContent || "").trim().length > 20) return true;
            return false;
          };
          var observer = new MutationObserver(function () {
            if (root.getAttribute("data-snapshot-preview") === "true") { observer.disconnect(); removeNow(); return; }
            if (isRealContent()) { observer.disconnect(); hide(); }
          });
          observer.observe(root, { childList: true, subtree: true, characterData: true, attributes: true });
          requestAnimationFrame(function () { if (isRealContent()) { observer.disconnect(); hide(); } });
          setTimeout(function () { if (isRealContent()) { observer.disconnect(); hide(); } }, 1200);
          // Hard fallback: never keep the splash on screen for more than 2.5s,
          // and let any tap dismiss it so it can never trap the user.
          setTimeout(function () { if (observer) observer.disconnect(); hide(); }, 2500);
          window.addEventListener("load", function () { setTimeout(function () { if (observer) observer.disconnect(); hide(); }, 300); });
          document.addEventListener("pointerdown", function () { if (observer) observer.disconnect(); hide(); }, { once: true });
        } catch (err) { /* ignore */ }
      })();
    </script>
    <!-- PageSnapshot injector removed: it stripped <style>/<link> from cached
         HTML before hydration, causing an unstyled-HTML flash on load. -->

    <!-- Speculation Rules API (Chromium 111+): prerender same-origin links on
         moderate hover intent. Falls back silently on Safari/Firefox. -->
    <script type="speculationrules">
      {
        "prerender": [
          { "source": "document", "where": { "and": [ { "href_matches": "/*" }, { "not": { "href_matches": "/api/*" } }, { "not": { "href_matches": "/auth/*" } } ] }, "eagerness": "moderate" }
        ],
        "prefetch": [
          { "source": "document", "where": { "href_matches": "/*" }, "eagerness": "conservative" }
        ]
      }
    </script>
